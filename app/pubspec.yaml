name: awwad
description: "عوّاد - تطبيق مجاني يساعدك على ترك العادات السيئة وبناء عادات نافعة بأسلوب علمي وقيم إسلامية."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Cloud (P2) — auth + sync. Disabled unless SUPABASE_URL/ANON_KEY are provided
  # via --dart-define, so the app runs fully offline by default.
  supabase_flutter: ^2.8.4

  # Routing
  go_router: ^14.6.2

  # Local persistence (P1 offline source; Drift sync layer lands in P2)
  shared_preferences: ^2.3.3

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.0

  # UI
  # NOTE: google_fonts was removed on 2026-07-20. It fetched Cairo over HTTP on
  # first launch, so a first run with no connection fell back to the platform
  # font - a direct breach of the offline-first rule. The type family is now
  # BUNDLED under assets/fonts (see the `fonts:` block below).
  fl_chart: ^0.69.2
  confetti: ^0.8.0

  # Misc
  url_launcher: ^6.3.1
  # Online/offline detection (used to hide the suggested-solutions/video card
  # when the device has no connection). Web-safe (navigator.onLine).
  connectivity_plus: ^6.1.0

  # Local notifications (mobile only; web uses a no-op via conditional import)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  share_plus: ^13.2.0

  # Prayer times: offline astronomical calculation (no API, no cost). Location
  # comes from GPS when granted, otherwise from the bundled city list.
  adhan: ^2.0.0+1
  geolocator: ^13.0.2

  # Quran audio wird: streams surah mp3s from the free mp3quran.net servers.
  just_audio: ^0.9.42
  audio_session: ^0.1.25
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true   # enables gen-l10n (AppLocalizations)
  assets:
    - assets/logo/sprout.png
    # Religious-habits engine (TODO 0d): offline city list for the prayer-time
    # fallback when GPS is unavailable, mp3quran reciters, and the curated
    # scholar videos per religious habit.
    - assets/data/cities.json
    - assets/data/reciters.json
    - assets/data/scholar_videos.json

  # Type family. IBM Plex Sans Arabic (IBM Corp. + Bold Monday + Khajag
  # Apelian + Wael Morcos), SIL Open Font License 1.1 - free for commercial
  # use and for embedding in an app; see assets/fonts/OFL.txt. It is the same
  # family wabl.sa uses for both its large titles and its sublines (verified
  # 2026-07-20 from the live computed styles, not from a guess).
  # BUNDLED, never fetched at runtime: the app must render identically with
  # the radio off.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Deliberate alias, not a copy-paste slip. On web, the Flutter engine
    # downloads Roboto from fonts.gstatic.com at boot whenever no family named
    # `Roboto` is registered. That is a third-party request the site half of
    # this project explicitly does not make, and it fails offline. Registering
    # the name here makes the engine use our own bundled face instead and the
    # gstatic request disappears (verified 2026-07-20 over the resource log,
    # not assumed).
    - family: Roboto
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "../assets/icons/icon-1024.png"
  adaptive_icon_background: "#0F1420"
  adaptive_icon_foreground: "../assets/icons/icon-foreground-1024.png"
  web:
    generate: true
    image_path: "../assets/icons/icon-1024.png"
    background_color: "#0D1117"
    theme_color: "#4F8EF7"

flutter_native_splash:
  color: "#0D1117"
  image: "../assets/icons/splash-logo.png"
  android_12:
    color: "#0D1117"
    image: "../assets/icons/splash-logo.png"
